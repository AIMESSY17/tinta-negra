<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estudio de tatuaje</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#121114">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pirata+One&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pirata+One&display=swap" media="print" onload="this.media='all'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23141317'/%3E%3Cpath d='M16 6c3 6 5 9 5 13a5 5 0 0 1-10 0c0-4 2-7 5-13z' fill='%23ece6d8'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="bg-static" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div id="intro"></div>

  <!-- banda grabada: nombre · capítulos · lámpara (y menú en celular) -->
  <header id="banda" class="banda">
    <div class="banda-in">
      <a class="marca" href="./" data-go="inicio"></a>
      <nav class="caps" aria-label="Capítulos"></nav>
      <div class="banda-act">
        <button type="button" id="tiltBtn" class="icon tilt-btn" aria-pressed="false" aria-label="Mover la mesa inclinando el teléfono" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3.5" width="8" height="17" rx="1"/><path d="M4 9 C2.6 11 2.6 13 4 15 M20 9 C21.4 11 21.4 13 20 15"/></svg>
        </button>
        <button type="button" class="icon" data-lamp aria-pressed="false" aria-label="Apagar la luz de la mesa (modo estudio)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10 L12 3 L18 10 Z"/><path d="M12 10 V18 M8 21 H16 M12 18 V21"/></svg>
        </button>
        <button type="button" id="menuBtn" class="icon menu-btn" aria-expanded="false" aria-controls="inkMenu" aria-label="Abrir el menú de páginas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20"/></svg>
        </button>
      </div>
    </div>
  </header>
  <nav id="inkMenu" class="ink-menu" aria-label="Páginas" hidden></nav>
  <nav id="tabbar" class="tabbar" aria-label="Capítulos"></nav>
  <button type="button" id="reserve" class="reserve" aria-label="Reservar turno: ir a Armá tu tatuaje"></button>
  <div class="progress" aria-hidden="true"><svg viewBox="0 0 12 1000" preserveAspectRatio="none"><path class="track" d=""/><path class="fill" d=""/></svg></div>
  <div id="cursor" aria-hidden="true"></div>

  <main id="main" tabindex="-1">
    <!-- tres páginas: el router muestra una sola; la mesa del fondo y la estatua quedan vivas -->
    <div class="page" data-page="inicio" hidden>
      <section id="hero" class="hero" aria-label="Inicio"></section>
      <section id="pedido" class="sec order"></section>
      <section id="cierre" class="sec closing"></section>
    </div>
    <div class="page" data-page="artista" hidden>
      <section class="sec chapter" data-chapter="artista"></section>
      <section id="artista" class="sec artist"></section>
      <section id="estilos" class="sec styles"></section>
      <section class="sec cta-sec" data-cta="¿Te gustó algo de la carpeta?"></section>
      <footer class="mini-foot" data-foot></footer>
    </div>
    <div class="page" data-page="info" hidden>
      <section class="sec chapter" data-chapter="info"></section>
      <section id="preguntas" class="sec faq" aria-label="Preguntas frecuentes"></section>
      <section id="etapas" class="sec pair" aria-label="El proceso y los cuidados">
        <div class="wrap pair-grid"><div id="proceso" class="process"></div><div id="cuidados" class="care"></div></div>
      </section>
      <section id="resenas" class="sec reviews" hidden></section>
      <section class="sec cta-sec" data-cta="¿Ya tenés la idea?"></section>
      <footer class="mini-foot" data-foot></footer>
    </div>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- boceto → stencil violeta: lo oscuro pasa a violeta, lo claro a blanco -->
      <filter id="stencil" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values=".299 .587 .114 0 0  .299 .587 .114 0 0  .299 .587 .114 0 0  0 0 0 1 0"/>
        <feComponentTransfer><feFuncR type="gamma" exponent="1.6"/><feFuncG type="gamma" exponent="1.6"/><feFuncB type="gamma" exponent="1.6"/></feComponentTransfer>
        <feColorMatrix type="matrix" values=".58 0 0 0 .42  0 .78 0 0 .22  0 0 .22 0 .78  0 0 0 1 0"/>
      </filter>
      <!-- tinta absorbida por el papel: borde irregular sin cambiar la forma de la letra -->
      <filter id="inkbleed" x="-4%" y="-10%" width="108%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feMorphology in="d" operator="dilate" radius=".3"/>
      </filter>
      <filter id="inkbleed-hover" x="-4%" y="-10%" width="108%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feMorphology in="d" operator="dilate" radius=".3"/>
      </filter>
      <!-- ornamentos del grimorio: esquina grabada y hoja del divisor -->
      <symbol id="esquina" viewBox="0 0 38 38"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
        <path d="M2 2 H24 M2 2 V24"/><path d="M7 7 C 16 7, 18 11, 18 18 M7 7 C 7 16, 11 18, 18 18"/>
        <path d="M18 18 C 22 18, 24 16, 24 13 M18 18 C 18 22, 16 24, 13 24"/></g>
        <path d="M2 -1.5 L5.5 2 L2 5.5 L-1.5 2 Z" transform="translate(5 5) scale(.8)" fill="currentColor"/></symbol>
      <symbol id="hoja" viewBox="0 0 46 18"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
        <path d="M23 9 C 18 3, 11 3, 6 9 C 11 15, 18 15, 23 9 Z"/><path d="M23 9 C 28 3, 35 3, 40 9 C 35 15, 28 15, 23 9 Z"/><path d="M6 9 H1 M40 9 H45"/></g>
        <path d="M23 5.5 L26.5 9 L23 12.5 L19.5 9 Z" fill="currentColor"/></symbol>
    </defs>
  </svg>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
